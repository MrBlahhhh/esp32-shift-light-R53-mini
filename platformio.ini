; PlatformIO — R53 shift light, CAN + BLE
;
; Board: Waveshare ESP32-S3-Zero (ESP32-S3FH4R2 — 4 MB flash, 2 MB quad PSRAM).
;
; There is no stock `esp32-s3-fh4r2` board in the platform; the older repos in
; this family referenced a community board JSON that is not installed here.
; esp32-s3-devkitc1-n4r2 is the stock definition matching the same silicon —
; N4 = 4 MB flash, R2 = 2 MB quad PSRAM — which is what the chip reports.
;
; Every pin is a build flag, so a rewire is an edit here and never to the source.
;
; Pin map:
;   GPIO4   WS2812B data — the shift light strip
;   GPIO5   SN65HVD230 TXD  (listen-only, so this line never actually drives)
;   GPIO6   SN65HVD230 RXD
;
; This is the map the earlier firmware in this family ran on the same hardware.
;   GPIO21  onboard WS2812 RGB — CAN/BLE status indicator
;
; GPIO19/20 are the native USB pair on this board and are left alone.
;
; min_spiffs is not optional: NimBLE plus the Arduino core plus FastLED does not
; fit the default 1.3 MB app partition, and the overflow surfaces as a link
; error with no obvious connection to Bluetooth.

[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc1-n4r2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_deps =
    fastled/FastLED@^3.9.0
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCONFIG_BT_NIMBLE_ENABLED=1
    ; Native USB CDC. USB_MODE=1 selects the hardware CDC path; without it the
    ; core reaches for TinyUSB's USBCDC and every Serial call fails to compile
    ; with "USBSerial was not declared in this scope".
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLED_GPIO=4
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=6
    ; The S3-Zero's onboard LED is an addressable WS2812, not a plain one, so
    ; mode 2. Driving it with digitalWrite — as the older firmware did — leaves
    ; it dark or stuck on a random colour.
    -DSTATUS_LED_PIN=21
    -DSTATUS_LED_MODE=2
;   Uncomment to boot straight into the RPM sweep and ignore CAN. The app can
;   also toggle this at runtime; the build flag only decides what happens at
;   power-on, so a bench board sweeps with no phone nearby.
;   -DSIMULATE_RPM
