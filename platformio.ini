; PlatformIO — R53 shift light, CAN + BLE
;
; One board: esp32-c3, the ESP32-C3 SuperMini the carrier PCB solders down.
; Onboard LED is a plain blue one on GPIO8, active low. Everything board
; specific is a build flag here; nothing in src/ knows which board it is on.
;
; The Waveshare ESP32-S3-Zero prototype was retired on 2026-09-29. Its last
; firmware is build 1 on the web flasher, from 5574d94. The carrier was laid
; out around the pin map that prototype ran, which is why these pins are what
; they are.
;
;   LED_GPIO 4   WS2812B data — the shift light strip
;   CAN_TX   5   SN65HVD230 TXD  (listen-only; never driven, see [env] platform)
;   CAN_RX   6   SN65HVD230 RXD
;
; On the C3, GPIO2/8/9 are strapping pins. GPIO8 is only driven after boot has
; already sampled it. 4/5/6 are not strapping pins.
;
; min_spiffs is not optional: NimBLE plus the Arduino core plus FastLED does
; not fit the default 1.3 MB app partition, and the overflow surfaces as a link
; error with no obvious connection to Bluetooth.

[env]
; Pinned, not "espressif32": listen-only TWAI on the S3 and C3 still drives
; dominant bits on bus errors unless the IDF was built with
; CONFIG_TWAI_ERRATA_FIX_LISTEN_ONLY_DOM. This pioarduino release (Arduino
; 3.3.7, IDF 5.5.2) has it on; canbus.cpp refuses to build without it. The
; official 6.x platform is IDF 4.4, and an unpinned name picks whichever
; espressif32 is newest on the machine.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_deps =
    fastled/FastLED@^3.9.0
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCONFIG_BT_NIMBLE_ENABLED=1
    ; Native USB CDC. USB_MODE=1 selects the hardware CDC path; without it the
    ; core reaches for TinyUSB's USBCDC, which neither of these parts has, and
    ; every Serial call fails to compile with "USBSerial was not declared".
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLED_GPIO=4
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=6
;   Uncomment to boot straight into the RPM sweep and ignore CAN. The app can
;   also toggle this at runtime; the build flag only decides what happens at
;   power-on, so a bench board sweeps with no phone nearby.
;   -DSIMULATE_RPM

; ESP32-C3 SuperMini. Plain LED on GPIO8, so mode 1 and active low.
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DSTATUS_LED_PIN=8
    -DSTATUS_LED_MODE=1
    -DSTATUS_LED_ACTIVE_LOW=1
