; PlatformIO — R53 shift light, CAN + BLE
;
; Two boards, one source. Everything that differs between them is a build flag
; here; nothing in src/ knows which board it is on.
;
;   esp32-s3-zero   Waveshare ESP32-S3-Zero. The board in the car today.
;                   Onboard LED is an addressable WS2812 on GPIO21.
;   esp32-c3        ESP32-C3 SuperMini. The module the carrier PCB solders down.
;                   Onboard LED is a plain blue one on GPIO8, active low.
;
; The strip and CAN pins are identical on both, which is deliberate: the
; carrier was laid out around the pin map the firmware already ran, rather
; than the other way round.
;
;   LED_GPIO 4   WS2812B data — the shift light strip
;   CAN_TX   5   SN65HVD230 TXD  (listen-only, so this line never drives)
;   CAN_RX   6   SN65HVD230 RXD
;
; On the C3, GPIO2/8/9 are strapping pins. GPIO8 is only driven after boot has
; already sampled it. 4/5/6 are not strapping pins on either part.
;
; min_spiffs is not optional: NimBLE plus the Arduino core plus FastLED does
; not fit the default 1.3 MB app partition, and the overflow surfaces as a link
; error with no obvious connection to Bluetooth.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_deps =
    fastled/FastLED@^3.9.0
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCONFIG_BT_NIMBLE_ENABLED=1
    ; Native USB CDC. USB_MODE=1 selects the hardware CDC path; without it the
    ; core reaches for TinyUSB's USBCDC, which neither of these parts has, and
    ; every Serial call fails to compile with "USBSerial was not declared".
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLED_GPIO=4
    -DCAN_TX_GPIO=5
    -DCAN_RX_GPIO=6
;   Uncomment to boot straight into the RPM sweep and ignore CAN. The app can
;   also toggle this at runtime; the build flag only decides what happens at
;   power-on, so a bench board sweeps with no phone nearby.
;   -DSIMULATE_RPM

; Waveshare ESP32-S3-Zero (ESP32-S3FH4R2). There is no stock esp32-s3-fh4r2
; board in the platform; esp32-s3-devkitc1-n4r2 is the stock definition for the
; same silicon — N4 = 4 MB flash, R2 = 2 MB quad PSRAM.
[env:esp32-s3-zero]
board = esp32-s3-devkitc1-n4r2
build_flags =
    ${env.build_flags}
    -DSTATUS_LED_PIN=21
    -DSTATUS_LED_MODE=2

; ESP32-C3 SuperMini. Plain LED on GPIO8, so mode 1 and active low.
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DSTATUS_LED_PIN=8
    -DSTATUS_LED_MODE=1
    -DSTATUS_LED_ACTIVE_LOW=1
